name: Android Signing Tools Export
on:
  push:
    branches:
      - feature/oppo-beta34-mock-ocs-20261103
    paths:
      - '.github/workflows/android-signing-tools-export.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Resolve Android Gradle signing library
        working-directory: android-app
        run: gradle --no-daemon -q :app:tasks >/dev/null
      - name: Collect public signing tools
        run: |
          APKSIG="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/apksig" -type f -name 'apksig-*.jar' -print | sort | tail -1)"
          test -s "$APKSIG"
          cp "$APKSIG" apksig.jar
          ls -lh apksig.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksig-public-tool
          path: apksig.jar
