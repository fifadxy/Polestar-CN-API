name: Android 1.1.0 Stable Regression
on:
  push:
    branches:
      - android-polestar-assistant-main
      - main
    paths:
      - 'android-app/**'
      - 'knowledge/PSASSISTANT_BETA47_CONTROL_LAYOUT_20261105.md'
      - 'docs/PSASSISTANT_BETA47_CONTROL_LAYOUT_20261105.md'
      - '.github/workflows/android-beta47-control-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable110:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and lint 1.1.0 app and LSPosed Bridge
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug :oppoBridge:assembleDebug :app:lintDebug
      - name: Verify 1.1.0 APKs and size
        run: |
          grep -q 'versionCode 164' android-app/app/build.gradle
          grep -q "versionName '1.1.0'" android-app/app/build.gradle
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk
          # Lossless APK re-compression keeps every resource and byte of executable content,
          # then re-signs the VALIDATION debug package with its ephemeral debug key.
          python3 scripts/compact_debug_apk.py android-app/app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" --keystore "$HOME/.android/debug.keystore"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v1.1.0-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-1.1.0-debug.apk
          python3 - <<'PY'
          import pathlib,zipfile,hashlib
          for f in ["PsAssistant-v1.1.0-VALIDATION-debug.apk","PsAssistant-OPPO-Bridge-1.1.0-debug.apk"]:
              file=pathlib.Path(f)
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None and "AndroidManifest.xml" in z.namelist()
              print(f,file.stat().st_size,hashlib.sha256(file.read_bytes()).hexdigest())
          assert pathlib.Path("PsAssistant-v1.1.0-VALIDATION-debug.apk").stat().st_size<10_000_000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v1.1.0-VALIDATION-debug
          path: PsAssistant-v1.1.0-VALIDATION-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-1.1.0-debug
          path: PsAssistant-OPPO-Bridge-1.1.0-debug.apk
          if-no-files-found: error
      - name: Full Android and Bridge regression tests
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :oppoBridge:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-1.1.0-UI-Test-Reports
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/oppoBridge/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
