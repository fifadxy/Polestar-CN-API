name: Android Beta34 Mock OCS
on:
  push:
    branches:
      - feature/oppo-beta34-mock-ocs-20261103
    paths:
      - 'android-app/**'
      - '.github/workflows/android-beta34-mock-ocs.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile lint and assemble beta34
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug :oppoBridge:assembleDebug :carlinkMockSdk:assembleRelease
      - name: Unit tests beta34
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Package outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.9.7-beta34-mock-ocs-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-v1.19.0-debug.apk
          cp android-app/carlinkMockSdk/build/outputs/aar/carlinkMockSdk-release.aar PsAssistant-OCS-Mock-1.4.0-TestLab.aar
          test -s PsAssistant-v0.9.7-beta34-mock-ocs-VALIDATION-debug.apk
          test -s PsAssistant-OCS-Mock-1.4.0-TestLab.aar
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.9.7-beta34-mock-ocs-VALIDATION-debug
          path: PsAssistant-v0.9.7-beta34-mock-ocs-VALIDATION-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OCS-Mock-1.4.0-TestLab
          path: PsAssistant-OCS-Mock-1.4.0-TestLab.aar
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-v1.19.0-debug
          path: PsAssistant-OPPO-Bridge-v1.19.0-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-beta34-mock-checks
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
