plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.polestarcn.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.polestarcn.companion'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3.0-alpha2'
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'io.grpc:grpc-okhttp:1.68.2'
    implementation 'io.grpc:grpc-stub:1.68.2'
}
