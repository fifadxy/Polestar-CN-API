name: Android Beta43 Unified Refresh
on:
  push:
    branches:
      - feature/psassistant-beta43-unified-refresh-20261105
    paths:
      - 'android-app/**'
      - 'knowledge/**'
      - 'docs/**'
      - '.github/workflows/android-beta43-refresh.yml'
  workflow_dispatch:
jobs:
  beta43:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify offline Standalone FULL packaging entrypoint
        run: |
          python3 -m py_compile scripts/package_standalone_full.py
          python3 scripts/package_standalone_full.py --help >/dev/null
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile app, Bridge and lint
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :oppoBridge:assembleDebug :app:lintDebug
      - name: Package validation APKs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v1.0.0-beta43-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-beta43-debug.apk
          test -s PsAssistant-v1.0.0-beta43-VALIDATION-debug.apk
          test -s PsAssistant-OPPO-Bridge-beta43-debug.apk
          sha256sum PsAssistant-v1.0.0-beta43-VALIDATION-debug.apk PsAssistant-OPPO-Bridge-beta43-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v1.0.0-beta43-VALIDATION-debug
          path: PsAssistant-v1.0.0-beta43-VALIDATION-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-beta43-debug
          path: PsAssistant-OPPO-Bridge-beta43-debug.apk
          if-no-files-found: error
      - name: Run Android and Bridge regression tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :oppoBridge:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-beta43-test-reports
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/oppoBridge/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
