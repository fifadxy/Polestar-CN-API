name: Android Beta35 Mock Shelf
on:
  push:
    branches:
      - feature/oppo-beta35-mock-shelf-20261103
    paths:
      - 'android-app/**'
      - '.github/workflows/android-beta35-mock-shelf.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile lint and assemble beta35
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug :oppoBridge:assembleDebug :carlinkMockSdk:assembleRelease
      - name: Unit tests beta35
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
          mkdir -p ../verification/beta35
          cp -a app/build/test-results/testDebugUnitTest ../verification/beta35/mock-test-results
      - name: Verify official-mode command authorization
        working-directory: android-app
        env:
          PSA_OPPO_MOCK_SDK: 'false'
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest --tests io.github.polestarcn.companion.BridgeAuthorizationBeta27Test
          cp -a app/build/test-results/testDebugUnitTest ../verification/beta35/official-authorization-results
      - name: Package outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.9.7-beta35-mock-shelf-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-v1.20.0-debug.apk
          cp android-app/carlinkMockSdk/build/outputs/aar/carlinkMockSdk-release.aar PsAssistant-OCS-Mock-1.4.0-TestLab.aar
          test -s PsAssistant-v0.9.7-beta35-mock-shelf-VALIDATION-debug.apk
          test -s PsAssistant-OCS-Mock-1.4.0-TestLab.aar
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.9.7-beta35-mock-shelf-VALIDATION-debug
          path: PsAssistant-v0.9.7-beta35-mock-shelf-VALIDATION-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OCS-Mock-1.4.0-TestLab
          path: PsAssistant-OCS-Mock-1.4.0-TestLab.aar
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-v1.20.0-debug
          path: PsAssistant-OPPO-Bridge-v1.20.0-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-beta35-mock-checks
          path: |
            verification/beta35/
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
