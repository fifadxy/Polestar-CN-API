name: Android Standalone Build

on:
  push:
    branches:
      - feature/android-standalone-v084-20261027
    paths:
      - 'android-app/**'
      - 'scripts/build_android_standalone.sh'
      - '.github/workflows/android-standalone.yml'
  pull_request:
    branches:
      - android-polestar-assistant-main
    paths:
      - 'android-app/**'
      - 'scripts/build_android_standalone.sh'
      - '.github/workflows/android-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: gradle -p android-app --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle -p android-app --no-daemon :app:lintDebug --stacktrace
      - name: Build standalone shell APK
        run: gradle -p android-app --no-daemon :app:assembleDebug --stacktrace
      - name: Verify runtime import was removed
        shell: bash
        run: |
          ! grep -q 'Import reference APK' android-app/app/src/main/java/io/github/polestarcn/companion/MainActivity.java
          ! grep -q 'ACTION_OPEN_DOCUMENT' android-app/app/src/main/java/io/github/polestarcn/companion/MainActivity.java
          ! grep -q 'app.c3garage.companion' android-app/app/src/main/AndroidManifest.xml
          grep -q 'standalone/account_compat.bin' android-app/app/src/main/java/io/github/polestarcn/companion/auth/ReferenceSignatureProvider.java
      - uses: actions/upload-artifact@v4
        with:
          name: psassistant-v085-standalone-shell
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report standalone CI to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 5 --body "Standalone CI: **${{ job.status }}** · run \`$GITHUB_RUN_ID\` · commit \`$GITHUB_SHA\`. Tests/Lint/build/import-removal check executed in this workflow."
