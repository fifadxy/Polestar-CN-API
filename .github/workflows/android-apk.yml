name: Android Companion APK
on:
  push:
    branches:
      - android-polestar-china-api
      - feature/android-companion-v0.1
      - android-polestar-assistant-main
      - feature/android-standalone-v086-hardening-20261028
    paths:
      - 'android-app/**'
      - 'knowledge/**'
      - 'scripts/**'
      - 'docs/HISINGEN_GLOBAL_CN_API_COMPARISON.md'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - android-polestar-assistant-main
  workflow_dispatch:
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Java model and safety gates
        run: |
          python3 scripts/verify_source.py
          python3 scripts/check_knowledge.py
          sh scripts/test_models.sh
          node scripts/test_map_distance.cjs
      - name: Ensure Android API 35 is present
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build standalone debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Configure private complete-build inputs
        env:
          PSA_CLIENT_CONFIG_SECRET: ${{ secrets.PSA_CLIENT_CONFIG }}
          PSA_SIGNING_KEYSTORE_BASE64: ${{ secrets.PSA_SIGNING_KEYSTORE_BASE64 }}
          PSA_SIGNING_STORE_PASSWORD: ${{ secrets.PSA_SIGNING_STORE_PASSWORD }}
          PSA_SIGNING_KEY_ALIAS: ${{ secrets.PSA_SIGNING_KEY_ALIAS }}
          PSA_SIGNING_KEY_PASSWORD: ${{ secrets.PSA_SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, pathlib, re
          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          client = os.environ.get('PSA_CLIENT_CONFIG_SECRET', '').strip().upper()
          encoded = os.environ.get('PSA_SIGNING_KEYSTORE_BASE64', '')
          password = os.environ.get('PSA_SIGNING_STORE_PASSWORD', '')
          values = {}

          if client:
              if not re.fullmatch(r'[0-9A-F]{32}', client):
                  raise ValueError('PSA_CLIENT_CONFIG format is invalid')
              client_file = runner / 'psassistant-client-config.txt'
              client_file.write_text(client, encoding='ascii')
              client_file.chmod(0o600)
              values['PSA_CLIENT_CONFIG_FILE'] = str(client_file)

          if encoded and password:
              key = runner / 'psassistant-signing.keystore'
              key.write_bytes(base64.b64decode(encoded, validate=True))
              key.chmod(0o600)
              values.update({
                  'PSA_SIGNING_KEYSTORE': str(key),
                  'PSA_SIGNING_STORE_PASSWORD': password,
                  'PSA_SIGNING_KEY_ALIAS': os.environ.get('PSA_SIGNING_KEY_ALIAS') or 'androiddebugkey',
                  'PSA_SIGNING_KEY_PASSWORD': os.environ.get('PSA_SIGNING_KEY_PASSWORD') or password,
              })

          if 'PSA_CLIENT_CONFIG_FILE' in values and 'PSA_SIGNING_KEYSTORE' in values:
              values['PSA_COMPLETE_BUILD'] = '1'

          if any('\n' in v or '\r' in v for v in values.values()):
              raise ValueError('Private build variables must be single-line')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for name, value in values.items():
                  out.write(name + '=' + value + '\n')

          print('Complete signed build inputs configured' if values.get('PSA_COMPLETE_BUILD') == '1'
                else 'Private complete-build inputs unavailable; validation Debug only')
          PYCODE

      - name: Build signed complete release and preview
        if: env.PSA_COMPLETE_BUILD == '1'
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:assemblePreview

      - name: Verify client config isolation
        shell: bash
        run: |
          DEBUG_APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          if unzip -Z1 "$DEBUG_APK" | grep -qx 'assets/client-signing.bin'; then
            echo "Debug validation APK unexpectedly contains private client configuration" >&2
            exit 1
          fi
          if [ "${PSA_COMPLETE_BUILD:-0}" = "1" ]; then
            RELEASE_APK=android-app/app/build/outputs/apk/release/app-release.apk
            test -s "$RELEASE_APK"
            test "$(unzip -p "$RELEASE_APK" assets/client-signing.bin | wc -c | tr -d ' ')" = "48"
          fi

      - name: Describe build configuration
        run: |
          if [ "${PSA_COMPLETE_BUILD:-0}" = "1" ]; then
            echo "Complete standalone Release/Preview built with private client configuration and persistent signing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation Debug only: private client configuration and/or persistent signing unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check output
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.8.6-beta1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.8.6-beta1-debug
          path: PsAssistant-v0.8.6-beta1-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PSA_COMPLETE_BUILD == '1'
        with:
          name: PsAssistant-v0.8.6-beta1-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PSA_COMPLETE_BUILD == '1'
        with:
          name: PsAssistant-v0.8.6-beta1-preview
          path: android-app/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-v0.8.6-beta1-checks
          path: |
            android-app/app/build/reports/previews/
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
