plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.polestarcn.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.polestarcn.companion'
        minSdk 26
        targetSdk 34
        versionCode 87
        versionName '0.8.6-beta1'
    }
    // The signing file stays outside the repository; CI secrets can supply the same identity.
    def persistentKey = System.getenv('PSA_SIGNING_KEYSTORE')
    signingConfigs {
        if (persistentKey) {
            persistent {
                storeFile file(persistentKey)
                storePassword System.getenv('PSA_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('PSA_SIGNING_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('PSA_SIGNING_KEY_PASSWORD') ?: System.getenv('PSA_SIGNING_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            if (persistentKey) signingConfig signingConfigs.persistent
            minifyEnabled false
            shrinkResources false
        }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            matchingFallbacks = ['release']
        }
    }
    sourceSets { main.assets.srcDir(layout.buildDirectory.dir("generated/standaloneAssets")) }
    buildFeatures { buildConfig = true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'io.grpc:grpc-okhttp:1.68.2'
    implementation 'io.grpc:grpc-stub:1.68.2'
}



tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

// Private account client configuration is generated only under ignored build output.
// Public validation builds omit it. Complete release/preview builds package a
// versioned opaque container instead of the raw 32-character value.
def clientAsset = layout.buildDirectory.file("generated/standaloneAssets/client-signing.bin")
def expectedClientConfigSha256 = "59e1ca066e23a43e3976ded60c6691800dd19c4b173bd94b241bee42be5a7274"
def clientMaskLabel = "PsAssistant-Standalone-ClientConfig-v2"

tasks.register("prepareClientConfig") {
    outputs.upToDateWhen { false }
    doLast {
        def configuredPath = System.getenv("PSA_CLIENT_CONFIG_FILE")
        def configured = configuredPath
                ? new File(configuredPath).getText("US-ASCII").trim()
                : (System.getenv("PSA_CLIENT_CONFIG") ?: "").trim()
        def asset = clientAsset.get().asFile
        if (!configured) {
            asset.delete()
            return
        }

        configured = configured.toUpperCase(java.util.Locale.ROOT)
        if (!(configured ==~ /[0-9A-F]{32}/)) {
            throw new GradleException("Invalid private client configuration format")
        }

        byte[] plain = configured.getBytes("US-ASCII")
        byte[] digest = java.security.MessageDigest.getInstance("SHA-256").digest(plain)
        String fingerprint = digest.collect { String.format("%02x", it & 0xff) }.join()
        if (fingerprint != expectedClientConfigSha256) {
            throw new GradleException("Private client configuration fingerprint mismatch")
        }

        byte[] mask = java.security.MessageDigest.getInstance("SHA-256")
                .digest(clientMaskLabel.getBytes("UTF-8"))
        byte[] magic = "PSACFG2\u0000".getBytes("US-ASCII")
        byte[] encoded = new byte[48]
        System.arraycopy(magic, 0, encoded, 0, magic.length)
        for (int i = 0; i < 32; i++) encoded[8 + i] = (byte) (plain[i] ^ mask[i])
        System.arraycopy(digest, 0, encoded, 40, 8)

        asset.parentFile.mkdirs()
        asset.bytes = encoded
        java.util.Arrays.fill(plain, (byte)0)
    }
}

tasks.register("verifyStandaloneClientAsset") {
    dependsOn("prepareClientConfig")
    doLast {
        def asset = clientAsset.get().asFile
        if (asset.exists()) {
            byte[] bytes = asset.bytes
            if (bytes.length != 48) throw new GradleException("Standalone client asset size mismatch")
            byte[] expectedMagic = "PSACFG2\u0000".getBytes("US-ASCII")
            for (int i = 0; i < expectedMagic.length; i++) {
                if (bytes[i] != expectedMagic[i]) {
                    throw new GradleException("Standalone client asset header mismatch")
                }
            }
        }
    }
}

tasks.named("preBuild").configure { dependsOn("verifyStandaloneClientAsset") }
tasks.matching { it.name in ["assembleRelease", "assemblePreview"] }.configureEach {
    doFirst {
        def asset = clientAsset.get().asFile
        if (!asset.exists() || asset.length() != 48L) {
            throw new GradleException("A complete distribution APK requires private client configuration")
        }
    }
}
