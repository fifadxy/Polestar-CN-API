name: Android Beta45 Fluid Cloud / OPPO Compatibility
on:
  push:
    branches:
      - feature/psassistant-beta45-fluid-cloud-20261105
    paths:
      - 'android-app/**'
      - 'docs/PSASSISTANT_BETA45_**'
      - 'knowledge/PSASSISTANT_BETA45_**'
      - '.github/workflows/android-beta45-fluid-cloud.yml'
  workflow_dispatch:
jobs:
  beta45:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build main app OPPO Bridge and watch lab
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :oppoBridge:assembleDebug :oppoWatchIndicator:assembleDebug :app:lintDebug
      - name: Copy validation APKs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v1.0.0-beta45-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-beta45-debug.apk
          cp android-app/oppoWatchIndicator/build/outputs/apk/debug/oppoWatchIndicator-debug.apk PsAssistant-OPPO-Watch-Indicator-beta45-debug.apk
          for f in PsAssistant-*.apk; do test -s "$f"; sha256sum "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v1.0.0-beta45-VALIDATION-debug
          path: PsAssistant-v1.0.0-beta45-VALIDATION-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-beta45-debug
          path: PsAssistant-OPPO-Bridge-beta45-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Watch-Indicator-beta45-debug
          path: PsAssistant-OPPO-Watch-Indicator-beta45-debug.apk
          if-no-files-found: error
      - name: Run all main app, Bridge and watch unit tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :oppoBridge:testDebugUnitTest :oppoWatchIndicator:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-Beta45-Test-Reports
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/oppoBridge/build/test-results/testDebugUnitTest/
            android-app/oppoWatchIndicator/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
