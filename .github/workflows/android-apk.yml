name: Android Companion APK
on:
  push:
    branches:
      - android-polestar-china-api
      - feature/android-companion-v0.1
      - android-polestar-assistant-main
      - hotfix/android-v095-beta2-20261029
      - feature/oppo-native-vehicle-bridge-c17-20261030
      - android-polestar-assistant-v093-work
    paths:
      - 'android-app/**'
      - 'knowledge/**'
      - 'scripts/**'
      - 'docs/HISINGEN_GLOBAL_CN_API_COMPARISON.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    env:
      PSA_CLIENT_CONFIG: ${{ secrets.PSA_CLIENT_CONFIG }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Java model and safety gates
        run: |
          python3 scripts/verify_source.py
          python3 scripts/check_knowledge.py
          sh scripts/test_models.sh
          node scripts/test_map_distance.cjs
      - name: Ensure Android API 35 is present
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build standalone debug APK and OPPO bridge
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :oppoBridge:assembleDebug
      - name: Configure persistent signing when available
        env:
          PSA_SIGNING_KEYSTORE_BASE64: ${{ secrets.PSA_SIGNING_KEYSTORE_BASE64 }}
          PSA_SIGNING_STORE_PASSWORD: ${{ secrets.PSA_SIGNING_STORE_PASSWORD }}
          PSA_SIGNING_KEY_ALIAS: ${{ secrets.PSA_SIGNING_KEY_ALIAS }}
          PSA_SIGNING_KEY_PASSWORD: ${{ secrets.PSA_SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, pathlib
          encoded = os.environ.get('PSA_SIGNING_KEYSTORE_BASE64', '')
          password = os.environ.get('PSA_SIGNING_STORE_PASSWORD', '')
          if encoded and password:
              key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'psassistant-signing.keystore'
              key.write_bytes(base64.b64decode(encoded, validate=True))
              key.chmod(0o600)
              values = {'PSA_SIGNING_KEYSTORE': str(key), 'PSA_SIGNING_STORE_PASSWORD': password,
                        'PSA_SIGNING_KEY_ALIAS': os.environ.get('PSA_SIGNING_KEY_ALIAS') or 'androiddebugkey',
                        'PSA_SIGNING_KEY_PASSWORD': os.environ.get('PSA_SIGNING_KEY_PASSWORD') or password}
              if any('\n' in v or '\r' in v for v in values.values()):
                  raise ValueError('Signing variables must be single-line')
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  for name, value in values.items():
                      out.write(name + '=' + value + '\n')
              print('Persistent release signing configured')
          else:
              print('No persistent key configured; debug APK is for validation, not a stable update identity')
          PYCODE
      - name: Build signed release with persistent identity
        if: env.PSA_SIGNING_KEYSTORE != '' && env.PSA_CLIENT_CONFIG != ''
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:assemblePreview
      - name: Describe build configuration
        run: |
          if [ -n "$PSA_CLIENT_CONFIG" ]; then
            echo "Standalone client configuration supplied" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation APK only: private account client configuration is absent. Use the signed complete APK delivered privately." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check output
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.9.7-beta1-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-v0.4.0-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-apksigner.jar
      - name: Verify integrated module packaging
        run: |
          python3 - <<'PYCODE'
          import zipfile, pathlib, hashlib
          p=pathlib.Path('PsAssistant-v0.9.7-beta1-debug.apk')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.read('META-INF/xposed/java_init.list').decode().strip() == 'io.github.polestarcn.oppobridge.OppoBridgeModule'
              assert b'minApiVersion=102' in z.read('META-INF/xposed/module.prop')
              assert b'com.heytap.mydevices' in z.read('META-INF/xposed/scope.list')
          print('Integrated APK bytes:', p.stat().st_size)
          print('SHA256:', hashlib.sha256(p.read_bytes()).hexdigest())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool
          path: android-apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.9.7-beta1-debug
          path: PsAssistant-v0.9.7-beta1-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-v0.4.0-debug
          path: PsAssistant-OPPO-Bridge-v0.4.0-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PSA_SIGNING_KEYSTORE != '' && env.PSA_CLIENT_CONFIG != ''
        with:
          name: PsAssistant-v0.9.7-beta1-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PSA_SIGNING_KEYSTORE != '' && env.PSA_CLIENT_CONFIG != ''
        with:
          name: PsAssistant-v0.9.7-beta1-preview
          path: android-app/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-v0.9.7-beta1-checks
          path: |
            android-app/app/build/reports/previews/
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
