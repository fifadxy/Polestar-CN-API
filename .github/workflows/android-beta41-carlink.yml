name: Android Beta41 CarLink Bound
on:
  push:
    branches:
      - feature/oppo-beta41-carlink-bound-app-20261104
    paths:
      - 'android-app/**'
      - 'scripts/verify_uploaded_carlink.py'
      - '.github/workflows/android-beta41-carlink.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Verify uploaded business logic
        run: python3 scripts/verify_uploaded_carlink.py
      - name: Compile lint and assemble beta41
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug :oppoBridge:assembleDebug
      - name: Package outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.9.7-beta41-carlink-bound-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-v2.3.0-debug.apk
          test -s PsAssistant-v0.9.7-beta41-carlink-bound-VALIDATION-debug.apk
          test -s PsAssistant-OPPO-Bridge-v2.3.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.9.7-beta41-carlink-bound-VALIDATION-debug
          path: PsAssistant-v0.9.7-beta41-carlink-bound-VALIDATION-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-v2.3.0-debug
          path: PsAssistant-OPPO-Bridge-v2.3.0-debug.apk
      - name: Unit tests beta41
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :oppoBridge:testDebugUnitTest
          mkdir -p ../verification/beta41
          cp -a app/build/test-results/testDebugUnitTest ../verification/beta41/app-test-results
          cp -a oppoBridge/build/test-results/testDebugUnitTest ../verification/beta41/bridge-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-beta41-carlink-bound-checks
          path: |
            verification/beta41/
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/oppoBridge/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
