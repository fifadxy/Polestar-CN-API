name: Digital Key Research Build

on:
  push:
    branches:
      - research/polestar2-digital-key-pak-20261027
    paths:
      - 'android-app/**'
      - 'digital-key-research/**'
      - '.github/workflows/digital-key-research-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Android research branch
        shell: bash
        run: gradle -p android-app :app:compileDebugJavaWithJavac --stacktrace

      - name: Build debug APK
        shell: bash
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Run digital-key non-operational lab tests
        shell: bash
        run: sh digital-key-research/scripts/run_lab_tests.sh

      - name: Upload research debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psassistant-digital-key-research-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
