name: Android Companion APK
on:
  push:
    branches:
      - android-polestar-china-api
      - feature/android-companion-v0.1
      - android-polestar-assistant-main
    paths:
      - 'android-app/**'
      - 'knowledge/**'
      - 'scripts/**'
      - 'docs/HISINGEN_GLOBAL_CN_API_COMPARISON.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Java model and safety gates
        run: |
          python3 scripts/verify_source.py
          python3 scripts/check_knowledge.py
          sh scripts/test_models.sh
      - name: Ensure Android API 35 is present
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build standalone debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check output
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.7.5-beta1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.7.5-beta1-debug
          path: PsAssistant-v0.7.5-beta1-debug.apk
          if-no-files-found: error
