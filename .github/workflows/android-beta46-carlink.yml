name: Android Beta46 CarLink Dual Mode
on:
  push:
    branches:
      - android-polestar-assistant-main
      - feature/psassistant-beta46-dual-carlink-20261105
    paths:
      - 'android-app/**'
      - '.github/workflows/android-beta46-carlink.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, lint and run all tests
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug :oppoBridge:assembleDebug \
            :app:lintDebug :app:testDebugUnitTest :oppoBridge:testDebugUnitTest
      - name: Verify version and artifact size
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk
          grep -q 'versionCode 160' android-app/app/build.gradle
          ! grep -q "include ':oppoWatchIndicator'" android-app/settings.gradle
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v1.0.0-beta46-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-beta46-debug.apk
          sha256sum PsAssistant-v1.0.0-beta46-VALIDATION-debug.apk PsAssistant-OPPO-Bridge-beta46-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v1.0.0-beta46-VALIDATION-debug
          path: PsAssistant-v1.0.0-beta46-VALIDATION-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-beta46-debug
          path: PsAssistant-OPPO-Bridge-beta46-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-Beta46-CarLink-Reports
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/oppoBridge/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
