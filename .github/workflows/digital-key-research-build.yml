name: Digital Key Research Build

on:
  push:
    branches:
      - research/polestar2-digital-key-pak-20261027
    paths:
      - 'android-app/**'
      - 'digital-key-research/**'
      - '.github/workflows/digital-key-research-build.yml'
  pull_request:
    branches:
      - android-polestar-assistant-main
    paths:
      - 'android-app/**'
      - 'digital-key-research/**'
      - '.github/workflows/digital-key-research-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Android research branch
        shell: bash
        run: gradle -p android-app :app:compileDebugJavaWithJavac --stacktrace

      - name: Build debug APK
        shell: bash
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Run digital-key non-operational lab tests
        shell: bash
        run: sh digital-key-research/scripts/run_lab_tests.sh

      - name: Upload research debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psassistant-digital-key-research-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-ui-smoke:
    name: Android 14 rooted emulator diagnostics UI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: psassistant-digital-key-research-debug
          path: digital-key-research/runtime/research-apk

      - name: Enable KVM on Linux
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 14 AVD installation and read-only UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: sh digital-key-research/scripts/run_android_ui_smoke.sh

      - name: Upload screenshot and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psassistant-digital-key-ui-smoke
          path: digital-key-research/runtime/ui-smoke/
          if-no-files-found: warn
