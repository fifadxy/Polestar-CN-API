name: Android direct APK
# build current branch head
on:
  push:
    branches:
      - feature/psa-v085-ui-fixes
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35 is present
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Assemble current debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.8.5-beta1-86-debug.apk
          ls -lh PsAssistant-v0.8.5-beta1-86-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.8.5-beta1-86-direct
          path: PsAssistant-v0.8.5-beta1-86-debug.apk
          retention-days: 7
