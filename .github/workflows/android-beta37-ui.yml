name: Android Beta37 UI
on:
  push:
    branches:
      - feature/oppo-beta37-ui-20261104
    paths:
      - 'android-app/**'
      - '.github/workflows/android-beta37-ui.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PSA_OPPO_MOCK_SDK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android API 35
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile lint and assemble beta37
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug :oppoBridge:assembleDebug
      - name: Unit tests beta37
        working-directory: android-app
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
          mkdir -p ../verification/beta37
          cp -a app/build/test-results/testDebugUnitTest ../verification/beta37/device-test-results
      - name: Package outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.9.7-beta37-ui-VALIDATION-debug.apk
          cp android-app/oppoBridge/build/outputs/apk/debug/oppoBridge-debug.apk PsAssistant-OPPO-Bridge-v2.0.0-debug.apk
          test -s PsAssistant-v0.9.7-beta37-ui-VALIDATION-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.9.7-beta37-ui-VALIDATION-debug
          path: PsAssistant-v0.9.7-beta37-ui-VALIDATION-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-OPPO-Bridge-v2.0.0-debug
          path: PsAssistant-OPPO-Bridge-v2.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsAssistant-beta37-ui-checks
          path: |
            verification/beta37/
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/reports/previews/beta37/
          if-no-files-found: ignore
