plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.polestarcn.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.polestarcn.companion'
        minSdk 26
        targetSdk 34
        versionCode 78
        versionName '0.7.8-beta1'
    }
    // The signing file stays outside the repository; CI secrets can supply the same identity.
    def persistentKey = System.getenv('PSA_SIGNING_KEYSTORE')
    signingConfigs {
        if (persistentKey) {
            persistent {
                storeFile file(persistentKey)
                storePassword System.getenv('PSA_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('PSA_SIGNING_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('PSA_SIGNING_KEY_PASSWORD') ?: System.getenv('PSA_SIGNING_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            if (persistentKey) signingConfig signingConfigs.persistent
            minifyEnabled false
            shrinkResources false
        }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            matchingFallbacks = ['release']
        }
    }
    buildFeatures { buildConfig = true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'io.grpc:grpc-okhttp:1.68.2'
    implementation 'io.grpc:grpc-stub:1.68.2'
}



tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}
