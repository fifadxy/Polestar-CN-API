name: Android Companion APK
on:
  push:
    branches:
      - android-polestar-china-api
      - feature/android-companion-v0.1
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --list_installed | head -35
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check output
        run: test -s android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polestar-android-companion-0.1.0-dev1-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
