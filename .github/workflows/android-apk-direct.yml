name: Android Companion Direct APK
on:
  push:
    branches:
      - feature/psa-v085-ui-fixes
    paths:
      - '.github/workflows/android-apk-direct.yml'
  workflow_dispatch:
jobs:
  direct-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify source gates
        run: |
          python3 scripts/verify_source.py
          python3 scripts/check_knowledge.py
          sh scripts/test_models.sh
          node scripts/test_map_distance.cjs
      - name: Ensure Android API 35 is present
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Assemble debug APK directly
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Configure persistent signing when available
        env:
          PSA_SIGNING_KEYSTORE_BASE64: ${{ secrets.PSA_SIGNING_KEYSTORE_BASE64 }}
          PSA_SIGNING_STORE_PASSWORD: ${{ secrets.PSA_SIGNING_STORE_PASSWORD }}
          PSA_SIGNING_KEY_ALIAS: ${{ secrets.PSA_SIGNING_KEY_ALIAS }}
          PSA_SIGNING_KEY_PASSWORD: ${{ secrets.PSA_SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, pathlib
          encoded=os.environ.get('PSA_SIGNING_KEYSTORE_BASE64','')
          password=os.environ.get('PSA_SIGNING_STORE_PASSWORD','')
          if encoded and password:
              key=pathlib.Path(os.environ['RUNNER_TEMP'])/'psassistant-signing.keystore'
              key.write_bytes(base64.b64decode(encoded,validate=True))
              key.chmod(0o600)
              values={
                'PSA_SIGNING_KEYSTORE':str(key),
                'PSA_SIGNING_STORE_PASSWORD':password,
                'PSA_SIGNING_KEY_ALIAS':os.environ.get('PSA_SIGNING_KEY_ALIAS') or 'androiddebugkey',
                'PSA_SIGNING_KEY_PASSWORD':os.environ.get('PSA_SIGNING_KEY_PASSWORD') or password
              }
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  for name,value in values.items(): out.write(name+'='+value+'\n')
          PYCODE
      - name: Assemble persistent-signed release when available
        if: env.PSA_SIGNING_KEYSTORE != ''
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare outputs
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk PsAssistant-v0.8.5-beta1-86-debug.apk
          if [ -s android-app/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-app/app/build/outputs/apk/release/app-release.apk PsAssistant-v0.8.5-beta1-86-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PsAssistant-v0.8.5-beta1-86-direct
          path: |
            PsAssistant-v0.8.5-beta1-86-debug.apk
            PsAssistant-v0.8.5-beta1-86-release.apk
          if-no-files-found: error
          retention-days: 7
