plugins { id 'com.android.application' }
android {
    namespace 'io.github.polestarcn.watchindicator'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.polestarcn.watchindicator'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0-indicator-lab'
    }
    buildTypes {
        debug { minifyEnabled false; shrinkResources false }
        release { minifyEnabled true; shrinkResources true }
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
